<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hear it from real offices | airfare</title>
<style>
  :root{
    --green:#256e57; --green-dark:#1e5a47; --green-tint:#eef5f1;
    --sage:#a8c5bc; --cream:#f9f8f5;
    --ink:#0f1724; --muted:#6b7280; --line:#e7e4dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",ui-sans-serif,system-ui,sans-serif;
    background:var(--cream); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px 20px; line-height:1.55;
    background-image:radial-gradient(1200px 500px at 50% -10%, #ecf5f0 0%, rgba(236,245,240,0) 60%);
  }
  .card{
    width:100%; max-width:640px; background:#fff; border:1px solid var(--line);
    border-radius:28px; padding:40px 36px 30px;
    box-shadow:0 24px 60px -30px rgba(15,23,36,.28);
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .brand{display:flex;align-items:center;gap:7px;margin-bottom:22px}
  h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin-bottom:10px}
  .lead{color:var(--muted);font-size:16px;margin-bottom:22px}
  .vid{position:relative;padding-top:56.25%;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-bottom:24px}
  .vid iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-weight:700;
    font-size:15px;padding:13px 24px;border-radius:999px;transition:transform .12s,background .12s}
  .btn:hover{background:var(--green-dark);transform:translateY(-1px)}
  .btn-ghost{background:transparent;color:var(--green);border:1.5px solid var(--sage)}
  .btn-ghost:hover{background:var(--green-tint);color:var(--green-dark)}
  .sub{margin-top:12px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/assets/airfare-logo.png" alt="airfare" style="height:28px;width:auto"></div>
    <h1>Hear it from real offices.</h1>
    <p class="lead">Office managers on what happened when the airfare box hit their breakroom.</p>
    <div class="vid">
      <iframe src="https://player.vimeo.com/video/1192090989?title=0&byline=0&portrait=0&badge=0&dnt=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="airfare customer testimonials"></iframe>
    </div>
    <div class="cta-row">
      <a class="btn" href="https://cal.com/justin-steinfelder-ipa7zf/20min" target="_blank" rel="noopener">Book your 20 minute snack plan call</a>
      <a class="btn btn-ghost" href="https://airfaresnacks.com" target="_blank" rel="noopener">Browse the snacks</a>
    </div>
    <p class="sub">Grab a time for the week your box lands. We build the plan around what your team actually eats.</p>
  </div>
</body>
</html>
